name: Build Android APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Smart All-in-One APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then unzip -oq "$ZIP_FILE"; fi
          fi
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle.kts not found in repository!"
            ls -la
            exit 1
          fi
          cd "$(dirname "$SETTINGS_FILE")"
          touch -a .env.example
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          gradle :app:assembleDebug --no-daemon -Pkotlin.incremental=false
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Smart-All-in-One.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-All-in-One-APK
          path: Smart-All-in-One.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Smart-All-in-One.apk --clobber
          else
            gh release create latest Smart-All-in-One.apk \
              --title "Smart All-in-One APK" \
              --notes "Automatically built Android APK from latest commit."
          fi
