name: Build Android APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Smart All-in-One APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build files and debug keystore
        run: |
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK copy
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-All-in-One.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-All-in-One-APK
          path: Smart-All-in-One.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Smart-All-in-One.apk --clobber
          else
            gh release create latest Smart-All-in-One.apk \
              --title "Smart All-in-One APK" \
              --notes "Automatically built Android APK from latest commit."
          fi
